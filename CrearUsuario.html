<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creación de Usuario - Gestión de Canchas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-primary: #fdf8f5;
      --surface-card: #ffffff;
      --primary: #e07a5f;
      --primary-light: #f4f1de;
      --primary-dark: #3d405b;
      --secondary: #81b29a;
      
      --text-main: #2b2d42;
      --text-muted: #6c757d;
      --border-color: #f0e6df;
      
      --elevation-1: 0 2px 4px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.1);
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
    }
    a.btn-action, a.btn-tool, a.btn-back {
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 0;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      background-color: var(--bg-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
    }

    @media (min-width: 768px) {
      body {
        padding: 20px 0;
      }
      .app-container {
        max-width: 768px;
        min-height: calc(100vh - 40px);
        border-radius: var(--radius-lg);
        overflow: hidden;
      }
    }

    /* Encabezado */
    .app-header {
      padding: 16px 20px;
      background-color: var(--surface-card);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .btn-back {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .header-titles h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .header-titles p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .content-area {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Formulario Creación de Usuario */
    .form-card {
      background-color: var(--surface-card);
      border-radius: var(--radius-md);
      padding: 20px 16px;
      box-shadow: var(--elevation-1);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-card h2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 4px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--primary-dark);
    }

    .form-control {
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      outline: none;
      background-color: var(--bg-primary);
      transition: border-color 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--primary);
      background-color: #ffffff;
    }

    /* Selector de Rol mediante Radio Cards estilo Material UI */
    .role-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    .role-option {
      position: relative;
    }

    .role-option input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .role-card {
      padding: 12px 10px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      background-color: var(--bg-primary);
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .role-card strong {
      font-size: 0.85rem;
      color: var(--primary-dark);
    }

    .role-card span {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .role-option input[type="radio"]:checked + .role-card {
      border-color: var(--primary);
      background-color: var(--primary-light);
      box-shadow: 0 0 0 1px var(--primary);
    }

    .role-option input[type="radio"]:checked + .role-card strong {
      color: var(--primary);
    }

    /* Select de Estado */
    select.form-control {
      cursor: pointer;
    }

    /* Botón de Acción */
    .btn-action {
      padding: 14px;
      background-color: var(--primary-dark);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      box-shadow: var(--elevation-1);
      transition: background-color 0.2s ease;
      margin-top: 10px;
    }

    .btn-action:hover {
      background-color: #2c2e43;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <header class="app-header">
      <!-- <button class="btn-back" onclick="alert('Volver a Home Administrador')">←</button> -->
       <a href="HomeAdmin.html" class="btn-back">←</a>
      <div class="header-titles">
        <h1>Crear Nuevo Usuario</h1>
        <p>Panel de Administración de Cuentas</p>
      </div>
    </header>

    <main class="content-area">
      
      <section class="form-card">
        <h2>Datos del Nuevo Usuario</h2>

        <form id="createUserForm">
          <!-- Nombre de usuario -->
          <div class="form-group" style="margin-bottom: 12px;">
            <label for="username">Usuario (Login) *</label>
            <input type="text" id="username" class="form-control" placeholder="Ej. jmendoza" required>
          </div>

          <!-- Nombre completo del actor -->
          <div class="form-group" style="margin-bottom: 12px;">
            <label for="fullName">Nombre Completo *</label>
            <input type="text" id="fullName" class="form-control" placeholder="Ej. Juan Mendoza" required>
          </div>

          <!-- Contraseña -->
          <div class="form-group" style="margin-bottom: 12px;">
            <label for="password">Contraseña *</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
          </div>

          <!-- Asignación de Rol -->
          <div class="form-group" style="margin-bottom: 12px;">
            <label>Rol del Usuario *</label>
            <div class="role-selector">
              <label class="role-option">
                <input type="radio" name="userRole" value="Encargado" checked>
                <div class="role-card">
                  <strong>Encargado</strong>
                  <span>Consultas diarias</span>
                </div>
              </label>

              <label class="role-option">
                <input type="radio" name="userRole" value="Administrador">
                <div class="role-card">
                  <strong>Administrador</strong>
                  <span>Acceso total / CRUD</span>
                </div>
              </label>
            </div>
          </div>

          <!-- Estado inicial del usuario -->
          <div class="form-group" style="margin-bottom: 12px;">
            <label for="userState">Estado *</label>
            <select id="userState" class="form-control">
              <option value="Activo" selected>Activo</option>
              <option value="Inactivo">Inactivo</option>
            </select>
          </div>

          <button type="submit" class="btn-action">
            Guardar Usuario
          </button>
        </form>
      </section>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
