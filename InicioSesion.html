<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión - Gestión de Canchas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-primary: #fdf8f5;
      --surface-card: #ffffff;
      --primary: #e07a5f;
      --primary-light: #f4f1de;
      --primary-dark: #3d405b;
      --secondary: #81b29a;
      
      --text-main: #2b2d42;
      --text-muted: #6c757d;
      --border-color: #f0e6df;
      
      --elevation-1: 0 2px 4px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.1);
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 0;
    }
    a.btn-action, a.btn-tool, a.btn-back {
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
    .app-container {
      width: 100%;
      max-width: 430px;
      background-color: var(--bg-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
    }

    @media (min-width: 768px) {
      body {
        padding: 20px 0;
      }
      .app-container {
        max-width: 768px;
        min-height: calc(100vh - 40px);
        border-radius: var(--radius-lg);
        overflow: hidden;
      }
    }

    /* Encabezado */
    .app-header {
      padding: 16px 20px;
      background-color: var(--surface-card);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .btn-back {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .header-titles h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .header-titles p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .content-area {
      flex: 1;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Tarjeta del Formulario de Login */
    .login-card {
      background-color: var(--surface-card);
      border-radius: var(--radius-md);
      padding: 24px 20px;
      box-shadow: var(--elevation-1);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 8px;
    }

    .login-header h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 4px;
    }

    .login-header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--primary-dark);
    }

    .form-control {
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      outline: none;
      background-color: var(--bg-primary);
      transition: border-color 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--primary);
      background-color: #ffffff;
    }

    .btn-action {
      padding: 14px;
      background-color: var(--primary-dark);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      box-shadow: var(--elevation-1);
      transition: background-color 0.2s ease;
      margin-top: 8px;
    }

    .btn-action:hover {
      background-color: #2c2e43;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <header class="app-header">
      <!-- <button class="btn-back" onclick="alert('Volver a la vista principal')">←</button> -->
       <a href="HomeAdmin.html" class="btn-back">←</a>
      <div class="header-titles">
        <h1>Acceso Administrativo</h1>
        <p>Sistema de Gestión de Canchas</p>
      </div>
    </header>

    <main class="content-area">
      
      <section class="login-card">
        <div class="login-header">
          <h2>Iniciar Sesión</h2>
          <p>Ingresa tus credenciales de Administrador o Encargado</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group" style="margin-bottom: 14px;">
            <label for="username">Usuario *</label>
            <input type="text" id="username" class="form-control" placeholder="Nombre de usuario" required>
          </div>

          <div class="form-group" style="margin-bottom: 14px;">
            <label for="password">Contraseña *</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn-action">
            Ingresar al Sistema
          </button>
        </form>
      </section>

    </main>
  </div>

  <script>
    // function handleLogin(event) {
    //   event.preventDefault();
      
    //   const user = document.getElementById('username').value;
      
    //   alert(`Sesión iniciada correctamente como: ${user}\nRedirigiendo a Home Administrador...`);
    // }

    function handleLogin(event) {
      event.preventDefault();
      alert('Sesión iniciada correctamente');
      window.location.href = "HomeAdmin.html";
    }
  </script>
</body>
</html>
